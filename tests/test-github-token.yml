name: Test github-token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Java
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jdk curl
          java -version

      - name: Create an already-formatted Java file
        run: |
          cat > "$GITHUB_WORKSPACE/Sample.java" << 'EOF'
          public class Sample {
            public static void main(String[] args) {
              System.out.println("Hello");
            }
          }
          EOF

      - id: action
        uses: .
        with:
          args: "--replace"
          files: "**/*.java"
          skip-commit: "true"
          release-name: "v1.24.0"
          github-token: "fake-token-for-testing"

      - name: Assert action completed with github-token input
        run: |
          echo "Checking that Sample.java exists after action ran with github-token input..."
          if [ ! -f "$GITHUB_WORKSPACE/Sample.java" ]; then
            echo "FAIL: Sample.java not found after action ran"
            exit 1
          fi
          echo "PASS: Action completed successfully with github-token input provided"
