name: Test specific release-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Java if not present
        run: |
          if ! command -v java &>/dev/null; then
            apt-get update -qq
            apt-get install -y -qq default-jdk
          fi
          java -version

      - name: Set up git user
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create src directory and copy Java file, then commit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/src"
          cp "$GITHUB_WORKSPACE/tests/fixtures/java/Sample.java" "$GITHUB_WORKSPACE/src/Sample.java"
          git add src/Sample.java
          git commit -m "Add Sample.java for specific-release test"
          echo "--- File content before formatting ---"
          cat "$GITHUB_WORKSPACE/src/Sample.java"

      - id: format
        uses: .
        with:
          args: "--replace"
          files: "src/**/*.java"
          skip-commit: "true"
          release-name: "v1.24.0"
          github-token: ${{ github.token }}

      - name: Assert Java file was formatted with specific release
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/src/Sample.java" ]; then
            echo "FAIL: src/Sample.java not found after formatting"
            exit 1
          fi
          echo "--- Formatted file content ---"
          cat "$GITHUB_WORKSPACE/src/Sample.java"
          echo "PASS: Action completed with specific release v1.24.0"

      - name: Assert file is formatted with proper indentation
        run: |
          # Google Java Format uses 2-space indentation
          if grep -q "  public static void main" "$GITHUB_WORKSPACE/src/Sample.java"; then
            echo "PASS: File appears to be formatted with proper 2-space indentation"
          else
            echo "WARN: Could not verify indentation - checking file content"
            cat "$GITHUB_WORKSPACE/src/Sample.java"
          fi
