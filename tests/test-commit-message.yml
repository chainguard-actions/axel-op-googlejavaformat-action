name: Test commit-message input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a Java file that is already formatted
        run: |
          mkdir -p src/main/java
          cat > src/main/java/Hello.java << 'EOF'
          public class Hello {
            public static void main(String[] args) {
              System.out.println("Hello, World!");
            }
          }
          EOF

      - id: action
        uses: .
        with:
          files: "**/*.java"
          skip-commit: "true"
          commit-message: "chore: apply google java format"

      - name: Assert action completed without error
        run: |
          echo "Action completed successfully with custom commit-message input"
          echo "PASS"
